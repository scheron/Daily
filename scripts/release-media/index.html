<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Release motion preview</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #191b20;
        color: #f8f8fa;
        font:
          16px Rubik,
          system-ui,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #viewport {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: #fff;
      }
      .motion-part {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #stage *,
      #stage *::before,
      #stage *::after {
        animation: none !important;
        transition: none !important;
        caret-color: transparent !important;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        flex-wrap: wrap;
        border-top: 1px solid #3c3e45;
      }
      button,
      input,
      label {
        font: inherit;
      }
      button {
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid #555;
        background: #30333b;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #b89dff;
        outline-offset: 4px;
      }
      #scrub {
        flex: 1;
        min-width: 180px;
      }
      #status {
        min-width: 140px;
        font-variant-numeric: tabular-nums;
      }
      #error {
        position: absolute;
        inset: 24px;
        white-space: pre-wrap;
        color: #ffb7b7;
        background: #191b20;
        display: none;
        padding: 24px;
        z-index: 999;
      }
      body.capture {
        display: block;
        background: transparent;
      }
      body.capture #viewport {
        width: 1920px;
        height: 1080px;
      }
      body.capture #controls {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="viewport" aria-label="Motion preview">
      <div id="stage"></div>
      <pre id="error" role="alert"></pre>
    </main>
    <footer id="controls">
      <button id="play" type="button" aria-label="Play preview">Play</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Preview frame" />
      <output id="status" aria-live="off">Loading…</output>
      <label><input id="reduced" type="checkbox" /> Reduced motion</label>
    </footer>
    <script type="module" src="./preview.mjs"></script>
  </body>
</html>
