name: Release Daily Sync Server

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/server-v}" >> $GITHUB_ENV

      - name: Derive rolling protocol tag from SYNC_PROTOCOL_VERSION
        run: scripts/ci/derive-protocol-tag.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DAILY_SERVER_PACKAGE_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/scheron/daily-server:${{ env.VERSION }}
            ghcr.io/scheron/daily-server:latest
            ghcr.io/scheron/daily-server:${{ env.PROTOCOL_TAG }}
