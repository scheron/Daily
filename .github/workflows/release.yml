name: Release Daily App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-daily-app
  queue: max

jobs:
  build-and-release:
    name: Build & Release on macOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Test release publishing
        run: node --test scripts/ci/publish-release.test.mjs

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          DEBUG: electron-builder
        run: pnpm --filter @daily/desktop build

      - name: Extract version from tag
        run: scripts/ci/extract-version.sh

      - name: Verify release DMG
        shell: bash
        run: scripts/ci/verify-dmg.sh "apps/desktop/dist/Daily-${VERSION#v}-mac.dmg"

      - name: Generate release notes from CHANGELOG.md
        shell: bash
        run: scripts/ci/generate-release-notes.sh

      - name: Publish GitHub Release
        id: publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs "$VERSION"

      - name: Trigger Homebrew tap update
        if: steps.publish.outputs.update_tap == 'true'
        shell: bash
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: scripts/ci/trigger-homebrew-tap-update.sh
