name: Release Daily App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release on macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.5.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          DEBUG: electron-builder
        run: pnpm --filter @daily/desktop build

      - name: Verify .dmg was produced
        shell: bash
        run: scripts/ci/verify-dmg.sh

      - name: Extract version from tag
        run: scripts/ci/extract-version.sh

      - name: Generate release notes from CHANGELOG.md
        shell: bash
        run: scripts/ci/generate-release-notes.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/dist/*.dmg

      - name: Trigger Homebrew tap update
        shell: bash
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: scripts/ci/trigger-homebrew-tap-update.sh
