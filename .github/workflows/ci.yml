name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck:all

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @daily/desktop build:compress
        env:
          NODE_ENV: production

  lint-deploy-script:
    name: Lint & Validate Deploy Script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck deploy/install.sh
        run: shellcheck deploy/install.sh

      - name: Generate the three topologies with install.sh --dry-run
        run: |
          mkdir -p /tmp/daily-domain /tmp/daily-ip /tmp/daily-no-proxy
          sh deploy/install.sh --domain daily.example.com --dir /tmp/daily-domain --dry-run
          sh deploy/install.sh --ip 203.0.113.10 --dir /tmp/daily-ip --dry-run
          sh deploy/install.sh --domain daily.example.com --no-proxy --dir /tmp/daily-no-proxy --dry-run

      - name: Shellcheck the generated daily.sh
        run: shellcheck /tmp/daily-domain/daily.sh

      - name: Validate generated compose files
        run: |
          (cd /tmp/daily-domain && docker compose -f compose.yaml config -q)
          (cd /tmp/daily-ip && docker compose -f compose.yaml config -q)
          (cd /tmp/daily-no-proxy && docker compose -f compose.yaml config -q)
