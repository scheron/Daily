name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: scripts/ci/pnpm-store-path.sh

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck:all

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: scripts/ci/pnpm-store-path.sh

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: scripts/ci/pnpm-store-path.sh

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @daily/desktop build:compress
        env:
          NODE_ENV: production

  lint-deploy-script:
    name: Lint & Validate Deploy Script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: scripts/ci/install-shellcheck.sh

      - name: Shellcheck deploy/install.sh and scripts/ci/
        run: shellcheck deploy/install.sh scripts/ci/*.sh

      - name: Generate the three topologies with install.sh --dry-run
        run: scripts/ci/generate-install-dry-runs.sh

      - name: Shellcheck the generated daily.sh
        run: shellcheck /tmp/daily-domain/daily.sh

      - name: Validate generated compose files
        run: scripts/ci/validate-compose-configs.sh

  package-check:
    name: Package Check
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: scripts/ci/pnpm-store-path.sh

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the macOS package
        run: pnpm --filter @daily/desktop build

      - name: Verify the packaged bundle
        shell: bash
        run: scripts/ci/verify-dmg.sh
